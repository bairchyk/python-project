[project]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.11"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# [dependency-groups]
# lint = [
#     "flake8 (>=7.3.0,<8.0.0)",
#     "mypy (>=2.3.1,<3.0.0)",
#     "black (>=26.5.1,<27.0.0)",
#     "isort (>=9.0.1,<10.0.0)"
# ]

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^2.3.1"
black = "^26.5.1"
isort = "^9.0.1"
types-requests = "^2.33.0.20261006"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pandas-stubs = "^3.0.5.260914"

[tool.black]
line-length = 119
exclude = 'venv'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
